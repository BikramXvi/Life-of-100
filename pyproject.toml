[project]
name = "life100"
version = "0.1.0"
description = "LIFE/100 — a depth-first ~100-citizen digital society simulation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "confluent-kafka>=2.5",
    "duckdb>=1.0",
    "google-genai>=0.3",
    "streamlit>=1.38",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psutil>=6.0",
    "snowflake-connector-python>=3.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["life100"]
