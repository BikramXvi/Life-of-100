server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side (BrowserRouter) routes like /people/:id --
    # any path nginx doesn't have a real file for falls back to index.html so
    # the SPA's own router handles it, instead of a bare nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
